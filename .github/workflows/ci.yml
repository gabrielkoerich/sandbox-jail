name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux only. GitHub has few macOS runners and jobs queue there, so shipcheck's test-macos covers macOS
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # Ubuntu's AppArmor stops bubblewrap making user namespaces, and a profile for bwrap alone lifts it
      - name: bubblewrap
        timeout-minutes: 5
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt update -q && sudo apt-get $apt install -y bubblewrap apparmor-profiles
          sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
          # Ubuntu 24.04 ships bubblewrap 0.9, and --overlay-src needs 0.10
          if bwrap --help 2>&1 | grep -q -- --overlay-src; then
            echo "SANDBOX_JAIL_EXPECT_OVERLAY=1" >> "$GITHUB_ENV"
          fi

      - run: cargo test

  # On main: next version from conventional commits (feat minor, breaking major, else patch), publish, tag, release
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Next version
        id: version
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          SUBJECTS=$(git log ${LAST:+"$LAST"..HEAD} --pretty=format:%s)
          if [ -z "$SUBJECTS" ] || ! echo "$SUBJECTS" | grep -qvE '^(chore|docs|ci)(\(.*\))?:'; then
            echo "nothing to release since ${LAST:-the start}"
            exit 0
          fi
          if [ -z "$LAST" ]; then
            V=0.1.0
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            if echo "$SUBJECTS" | grep -qE '^(BREAKING CHANGE:|breaking(\(.*\))?:)'; then V="$((MA + 1)).0.0"
            elif echo "$SUBJECTS" | grep -qE '^feat(\(.*\))?:'; then V="$MA.$((MI + 1)).0"
            else V="$MA.$MI.$((PA + 1))"; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing v$V"

      # Publish first: a tag without a crate is worse than a crate without a tag, and a retry then tags it
      - name: Publish to crates.io
        if: steps.version.outputs.version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          cargo publish --allow-dirty

      - name: Tag and release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
